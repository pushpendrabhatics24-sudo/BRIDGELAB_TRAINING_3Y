<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Events Example</title>
<style>
body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
#mouseBox { width: 200px; height: 100px; background-color: lightblue; line-height: 100px;
  margin: 20px auto; cursor: pointer; border-radius: 8px; }
#output { margin-top: 20px; font-weight: bold; color: darkblue; }
input { padding: 8px; width: 200px; margin: 10px; }
form { margin-top: 30px; }
</style>
</head>
<body>
<h1>JavaScript Events Demo</h1>
<div id="mouseBox">Click Me</div>
<input type="text" id="keyInput" placeholder="Type something..." />
<form id="myForm">
  <input type="text" id="nameInput" placeholder="Enter your name" required />
  <button type="submit">Submit</button>
</form>
<p id="output">Try interacting with the elements!</p>
<script src="script.js"></script>
</body>
</html>
